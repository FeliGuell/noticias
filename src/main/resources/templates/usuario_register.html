<section class="bg-light py-3 py-md-5 mt-5">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-12 col-sm-10 col-md-8 col-lg-6 col-xl-5 col-xxl-4">
        <div th:if="${error != null}" class="card text-white bg-danger mb-3 mensajeError mt-5" >
          <div class="card-body">
            <h5 class="card-title">Error!</h5>
            <p class="card-text" th:text="${error}"></p>
          </div>
        </div>
        <div th:if="${exito != null}" class="card text-white bg-success mb-3 mt-3 mensajeExito" >
          <div class="card-body">
            <h5 class="card-title">Exito!</h5>
            <p class="card-text" th:text="${exito}"></p>
          </div>
        </div>
        <div class="card border border-light-subtle rounded-3 shadow-sm">
          <div class="card-body p-3 p-md-4 p-xl-5">
            <div class="text-center mb-3">
              <a href="#!">
                <img th:src="@{/images/flash-icono.png}" class="img-custom" alt="Logo" width="200" height="100">
              </a>
            </div>
            <h2 class="fs-6 fw-normal text-center text-secondary mb-4">Introduzca sus datos para registrarse</h2>
            <form  th:action="@{/registro}" method="POST" th:object="${usuario}">
              <div class="row gy-2 overflow-hidden">
                <div class="col-12">
                  <div class="form-floating mb-3">
                    <input type="text" class="form-control" th:field="*{nombreUsuario}" name="nombreUsuario" id="nombreUsuario" placeholder="Nombre del usuario" required>
                    <label for="nombreUsuario" class="form-label">Nombre de usuario</label>
                  </div>
                </div>
                <div class="col-12">
                  <div class="form-floating mb-3">
                    <input type="password" class="form-control" name="password" id="password" th:field="*{password}" value="" placeholder="Contraseña" minlength="5" required>
                    <label for="password" class="form-label">Contraseña</label>
                  </div>
                </div>
                <div class="col-12">
                  <div class="form-floating mb-3">
                    <input type="password" class="form-control" name="password2" id="password2"  value="" placeholder="Repetir contraseña" minlength="5" required>
                    <label for="password2" class="form-label">Repetir contraseña</label>
                  </div>
                </div>
                <div class="col-12">
                  <div class="d-grid my-3">
                    <button class="btn btn-primary btn-lg mb-1" type="submit">Registrar</button>
                  </div>
                </div>
                <div class="col-12">
                  <p class="m-0 text-secondary text-center">Ya tiene cuenta? <a th:href="@{/login}" class="link-primary text-decoration-none">Loguearse</a></p>
                </div>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>

<footer th:replace="~{fragments/footer :: footer}">
</footer>
